# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-myhlu-robot"
BBFILE_PATTERN_meta-myhlu-robot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-myhlu-robot = "6"

LAYERDEPENDS_meta-myhlu-robot = "core"
LAYERSERIES_COMPAT_meta-myhlu-robot = "scarthgap"
